[project]
name = "clyde"
version = "0.1.0"
description = "The Claude Code CLI as an OpenAI-compatible model provider on localhost."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "tochi-mba" }]
keywords = ["claude-code", "openai", "llm", "provider", "lucy"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# No keyring-client and no httpx: this binds to loopback, authenticates nobody, and calls a
# subprocess rather than a network. Adding auth here would be inventing a threat this does not
# have -- it is the same posture as LM Studio or Ollama on the same machine.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
clyde = "clyde.__main__:main"

[project.urls]
Repository = "https://github.com/tochi-mba/clyde"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clyde"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "C4", "DTZ", "E", "EM", "ERA", "F", "FA",
    "I", "ICN", "N", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = ["ANN401", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"src/clyde/api/routers/*" = ["TC001", "TC002", "TC003"]
"src/clyde/api/errors.py" = ["TC001", "TC002", "TC003"]
# `cli/run.py` is the one module allowed to spawn a process, so it is the one module where
# ruff's subprocess rules are answered in prose rather than by not doing it.
"src/clyde/cli/run.py" = ["S603"]
"tests/**" = [
    "ARG001", "ARG002", "S101", "S105", "S106", "S107", "SLF001",
    "PLR2004", "TC001", "TC002", "TC003", "PLC0415", "S404", "S603", "S607",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["clyde"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true
strict = true
warn_unreachable = true
show_error_codes = true

# `tests/test_contract.py` imports the hub from a sibling checkout when there is one, and
# skips itself when there is not. Neither mypy nor a contributor should need it present.
[[tool.mypy.overrides]]
module = ["lucy_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
testpaths = ["tests"]
markers = ["live: spawns a real `claude` process; excluded from `make check`"]
addopts = "-m 'not live'"

[tool.coverage.run]
branch = true
source = ["clyde"]
omit = ["src/clyde/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.importlinter]
root_package = "clyde"
include_external_packages = true

# The architecture in three contracts.
[[tool.importlinter.contracts]]
name = "The layers run one way: api -> openai -> cli -> core"
type = "layers"
layers = ["clyde.api", "clyde.openai", "clyde.cli", "clyde.core"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "The CLI layer knows nothing about OpenAI's shapes"
type = "forbidden"
source_modules = ["clyde.cli"]
forbidden_modules = ["clyde.openai", "clyde.api", "fastapi"]

# Spawning a process is the one genuinely dangerous thing here, so it happens in one file and
# a contract says so. Anything else reaching for `subprocess` is a bug you can see in a diff.
[[tool.importlinter.contracts]]
name = "Only cli.run spawns a process"
type = "forbidden"
source_modules = [
    "clyde.api",
    "clyde.openai",
    "clyde.core",
    "clyde.cli.argv",
    "clyde.cli.locate",
    "clyde.cli.sandbox",
]
forbidden_modules = ["subprocess"]
